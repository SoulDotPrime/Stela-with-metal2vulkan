name: dist-radv

# Builds the AMD/Vulkan image and the Linux `stela` installer. The steps are
# the release workflow's own (`.github/workflows/release.yml`): Clang 21 from
# apt.llvm.org, the SPIR-V libraries `.github/spirv.sh` builds there, and the
# upstream GPU sources `cargo xtask gpu fetch` checks out. None of them is
# optional: the image is not built from a naked toolchain.
#
# The runner is what makes this worth doing elsewhere than on a desktop: the
# RADV/ACO/LLVM build wants more RAM than a small machine has.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dist-radv-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  dist:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      # Clang 21 is the floor: `xtask/src/clang.rs` admits 21 to 23 only,
      # and Ubuntu 24.04 ships 18. mesa_clc links this toolchain's LLVM and
      # libclang-cpp.
      - name: Install Clang 21 and the GPU host tools
        run: |
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-21 main" \
            | sudo tee /etc/apt/sources.list.d/llvm-21.list
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            clang-21 lld-21 llvm-21 llvm-21-dev libclang-21-dev libclang-cpp21-dev \
            cmake ninja-build pkg-config git curl xz-utils zstd \
            glslang-tools spirv-tools python3
          echo /usr/lib/llvm-21/bin >> "$GITHUB_PATH"

      - name: Install Rust
        run: |
          rustup toolchain install
          rustc --version
          clang --version | head -1

      # The release workflow's own script: SPIRV-Tools and SPIRV-LLVM-
      # Translator for LLVM 21, static, with pkg-config files.
      - name: SPIR-V libraries
        run: |
          bash .github/spirv.sh .tools/spirv
          echo "PKG_CONFIG_PATH=$PWD/.tools/spirv/lib/pkgconfig" >> "$GITHUB_ENV"

      # Mesa's and LLVM's sources for the image, at the pins the repository
      # records. `dist` needs them; it does not unpack them.
      - name: Fetch upstream GPU sources
        run: cargo xtask gpu fetch

      - name: Build the RADV image and the installer
        env:
          # The two shared objects `mesa_clc` loads by soname once the
          # libraries build; the local `.tools/env-radv.sh` carries the same.
          LD_LIBRARY_PATH: /usr/lib/llvm-21/lib
          RUST_BACKTRACE: 1
        run: cargo xtask dist --radv

      - name: Say what was built
        run: |
          ls -l target/release/stela \
                target/boot/x86_64-unknown-uefi/release/stela-radv.efi
          efi=target/boot/x86_64-unknown-uefi/release/stela-radv.efi
          [[ "$(head -c 2 "$efi")" == MZ ]] || { echo "::error::$efi is not a PE image"; exit 1; }
          ./target/release/stela --version
          { echo "Vulkan drivers: $(paste -sd, target/gpu/nvk/vulkan-drivers)"
            echo "stela-radv.efi: $(stat -c %s "$efi") bytes"
            echo "sha256 $(sha256sum "$efi" | cut -d' ' -f1)"; } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the installer and the image
        uses: actions/upload-artifact@v4
        with:
          name: stela-radv-linux-x86_64
          if-no-files-found: error
          path: |
            target/release/stela
            target/boot/x86_64-unknown-uefi/release/stela-radv.efi
